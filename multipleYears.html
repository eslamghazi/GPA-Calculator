<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="HandheldFriendly" content="true">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPA Calculator</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.2/css/bootstrap.min.css"  rel="stylesheet" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.2/js/bootstrap.min.js"  crossorigin="anonymous"></script>
    

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.7.12/sweetalert2.all.js" crossorigin="anonymous"></script>

   <script src="./Scripts/multipleYears.js"></script>

</head>

<body oncontextmenu="return false;">
    <div class="main-bg">
        <div class="gpa-card">
            <div class="text-center mb-4">
                <h2 class="text-primary mb-1">حساب المعدل التراكمي لعدة سنوات</h2>
                <h5 class="text-secondary mb-3">❣️ أدخل بيانات كل فصل دراسي أدناه ❣️</h5>
            </div>
            <form onsubmit="getVall(); return false;">
                <div id="terms-container">
                    <div class="row term-row mb-3">
                        <div class="col-12 mb-1">
                            <label class="term-label d-block text-center py-2 mb-2">الفصل رقم 1</label>
                        </div>
                        <div class="col-12 mb-1">
                            <input class="form-control mb-2 text-center big-input" name="termName" placeholder="اسم الفصل [اختياري]" type="text">
                        </div>
                        <div class="col-md-6 mb-1">
                            <input class="form-control mb-2 big-input" autocomplete='off' name="termHours" placeholder="ساعات الفصل" type="number" min="1" max="50">
                        </div>
                        <div class="col-md-6 mb-1">
                            <input class="form-control mb-2 big-input" autocomplete='off' name="termGpa" placeholder="معدل الفصل" type="number" min="0" max="4" step="0.01">
                        </div>
                        <div class="col-md-12 d-flex align-items-center ">
                            <button type="button" class="btn btn-danger btn-md remove-btn-medium w-100 big-input remove-term-btn" title="حذف الفصل" style="display:none;">حذف الفصل -</button>
                        </div>
                    </div>
                </div>
                <div class="text-center mb-3">
                    <button type="button" id="add-term-btn" class="btn btn-outline-primary btn-md py-2 mb-2" style="font-size:1.1em;">إضافة فصل +</button>
                </div>
                <div class="d-grid gap-2 col-8 mx-auto mt-4 text-center">
                    <button type="submit" class="btn btn-primary btn-md py-2" style="font-size:1.1em;">احسب المعدل التراكمي</button>
                </div>
            </form>
            <div class="d-grid gap-2 col-8 mx-auto mt-3 text-center">
                <a href="./index.html" class="btn btn-secondary btn-md py-2 mt-3" style="font-size:1.05em;">حساب سنة واحدة</a>
            </div>
        </div>
    </div>
    <script src="footerLoader.js"></script>
</body>

</html>
