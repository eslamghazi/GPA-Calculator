<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="HandheldFriendly" content="true">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPA Calculator</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.2/css/bootstrap.min.css"  rel="stylesheet" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.2/js/bootstrap.min.js"  crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.7.12/sweetalert2.all.js" crossorigin="anonymous"></script>
    <script src="./Scripts/singleYear.js"></script>
</head>

<body oncontextmenu="return false;">
    <div class="main-bg">
        <div class="gpa-card">
            <div class="text-center mb-4">
                <h2 class="text-primary mb-1">حساب المعدل التراكمي لسنة واحدة</h2>
                <h5 class="text-secondary mb-3">❣️ أدخل البيانات أدناه ❣️</h5>
            </div>
            <form onsubmit="getVall(); return false;">
                <div id="subjects-container">
                    <div class="row subject-row mb-2">
                        <div class="col-12 mb-1">
                            <label class="subject-label d-block text-center py-2 mb-2">المادة رقم 1</label>
                        </div>
                        <div class="col-12 mb-1">
                            <input class="form-control mb-2 text-center big-input" name="subjectName" placeholder="اسم المادة [اختياري]" type="text">
                        </div>
                        <div class="col-md-6">
                            <input class="form-control mb-2 big-input" autocomplete='off' name="courseHours" placeholder="ساعات المادة" type="number" min="1" max="20">
                        </div>
                        <div class="col-md-6">
                            <input class="form-control mb-2 big-input" autocomplete='off' name="courseScore" placeholder="درجتك في المادة" type="number" min="0" max="100">
                        </div>
                    </div>
                </div>
                <div class="text-center mb-3">
                    <button type="button" id="add-subject-btn" class="btn btn-outline-success btn-md py-2 mb-2 big-input" style="font-size:1.1em;">إضافة مادة أخرى +</button>
                </div>

                <div class="alert alert-info text-right info-alert" style="font-size: 1.25em; direction: rtl; font-weight: bold; padding: 1.2em 1.5em;">
                    يمكنك حساب هذا الترم (المواد والدرجات أعلاه) مع ترم آخر (عادي أو صيفي). يجب اختيار نوع الترم عند الإضافة. إذا كان الترم صيفي، فإن المادة التي حصلت فيها على الدرجة الكاملة تُحسب 60 من 100 فقط.
                </div>
                
                <div class="mb-3">
                    <label class="font-weight-bold">الفصول الأخرى (اختياري):</label>
                    <div id="terms-container">
                        <!-- Dynamic term rows will be added here -->
                    </div>
                    <div class="text-center mt-2">
                        <button type="button" id="add-term-btn" class="btn btn-outline-primary btn-md py-2 mb-2 big-input" style="font-size:1.1em;">إضافة فصل +</button>
                    </div>
                </div>
                <div class="d-grid gap-2 col-8 mx-auto mt-4 text-center">
                    <button type="submit" class="btn btn-primary btn-lg">احسب المعدل التراكمي</button>
                </div>
            </form>
            <div class="d-grid gap-2 col-8 mx-auto mt-3 text-center">
                <a href="./multipleYears.html" class="btn btn-secondary btn-md py-2 mt-3" style="font-size:1.05em;">حساب المعدل التراكمي لعدة سنوات</a>
            </div>
        </div>
    </div>
    <datalist id="Coursesss">
        <option label="الترم الأول">مقررات المستوى الأول</option>
        <option value="6" >اساسيات التمريض (١)</option>
        <option value="3">التشريح (١)</option>
        <option value="2">الفسيولوجى (١)</option>
        <option value="3">تغذية وكيمياء حيوية</option>
        <option value="2">علم اجتماع</option>
        <option value="2">حقوق الإنسان والمواطنه</option>
        <option value="2">لغة إنجليزية</option>

        <option  label="الترم الثانى">مقررات المستوى الأول</option>
        <option value="7">اساسيات التمريض (٢)</option>
        <option value="2">التشريح (٢)</option>
        <option value="2">الفسيولوجى (٢)</option>
        <option value="2">بكتريولوجى</option>
        <option value="2">طفيليات</option>

        <option  label="الترم الأول">مقررات المستوى الثانى</option>
        <option value="7">تمريض باطنى جراحى (١)</option>
        <option value="4">التقييم الصحى</option>
        <option value="3">باثو فسيولوجى</option>
        <option value="2">عقاقير</option>
        <option value="2">علم نفس</option>

        <option  label="الترم الثانى">مقررات المستوى الثانى</option>
        <option value="7">تمريض باطنى جراحى (٢)</option>
        <option value="2">المعلوماتية فى التمريض</option>
        <option value="2">ادوية تطبيقية</option>
        <option value="2">استراتيجية التعليم والتثقيف الصحى</option>
        <option value="2">التواصل والعلاقات الإنسانية</option>
        <option value="2">النواحى القانونية والأخلاقية فى التمريض</option>

        <option>مقررات المستوى الثالث</option>
        <option value="7">تمريض الطوارئ</option>
        <option value="7">تمريض الأطفال</option>
        <option value="7">تمريض صحة المرأة والتوليد</option>
        <option value="2">النمو والتطور فى المراحل</option>
        <option value="2">تغذية تطبيقية</option>
        <option value="2">البحث فى التمريض</option>
        <option value="2">مبادئ الإحصاء</option>
        <option value="3">وبائيات</option>

        <option >مقررات المستوى الرابع</option>
        <option value="7">تمريض صحة المجتمع</option>
        <option value="7">تمريض الصحة النفسية والعقلية</option>
        <option value="4">إدارة تمريض</option>
        <option value="2">مهارات تطوير العاملين</option>
        <option value="2">الممارسة القائمة على الدليل</option>
        <option value="7">تمريض حالات حرجة</option>
        <option value="2">مشروع التخرج</option>

        <option >مقررات اختياريه للكليه</option>
        <option value="2">مبادئ التأهيل</option>
        <option value="2">علم الوراثة</option>
        <option value="2">تخطيط وتنسيق المستشفيات</option>
        <option value="2">نمط الحياة الصحى والأمراض المزمنة</option>
        <option value="2">ضغوط نفسية</option>
        
        <option >مقررات اختياريه للجامعة</option>
        <option value="2">مهارات التواصل</option>
        <option value="2">حاسب آلى</option>
        <option value="2">نشأة العلوم الطبية</option>
        <option value="2">ثقافة رياضية</option>
        <option value="2">دراسة جدوى</option>
        <option value="2">اخلاقيات ومهارات البحث العلمى</option>
        <option value="2">لغة عربية</option>
    </datalist>
    <datalist id="hourssss">
        <option value="20" label="ساعات المستوى الثانى الترم الأول"></option>
    </datalist>
    <script src="footerLoader.js"></script>
</body>

</html>
